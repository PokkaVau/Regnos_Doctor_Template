<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1E0E"/>
      <stop offset="50%" stop-color="#242C16"/>
      <stop offset="100%" stop-color="#313B1F"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A6D8D0"/>
      <stop offset="100%" stop-color="#C2EBE5"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A6D8D0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#768B6C" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(166, 216, 208, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  
  <!-- Subtle Decorative Shapes -->
  <circle cx="700" cy="100" r="220" fill="url(#glow)"/>
  <circle cx="100" cy="500" r="180" fill="url(#glow)"/>
  
  <!-- Border -->
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="rgba(166, 216, 208, 0.3)" stroke-width="1" rx="12"/>
  <rect x="32" y="32" width="736" height="536" fill="none" stroke="rgba(118, 139, 108, 0.25)" stroke-width="1" rx="8"/>
  
  <!-- Category Badge -->
  <rect x="60" y="60" width="220" height="34" rx="17" fill="rgba(166, 216, 208, 0.18)" stroke="#A6D8D0" stroke-width="1"/>
  <text x="170" y="82" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#A6D8D0" letter-spacing="1.5" text-anchor="middle">TRANSLATIONAL RESEARCH</text>
  
  <!-- Central Scientific / Clinical Graphic Motif -->
  <g transform="translate(400, 270)">
    <circle cx="0" cy="0" r="70" fill="rgba(255,255,255,0.02)" stroke="#768B6C" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#A6D8D0" stroke-width="1"/>
    <circle cx="0" cy="0" r="12" fill="url(#accentGrad)"/>
    <path d="M -85 0 L 85 0 M 0 -85 L 0 85" stroke="rgba(166, 216, 208, 0.15)" stroke-width="1"/>
    <circle cx="-50" cy="-50" r="6" fill="#A6D8D0" opacity="0.8"/>
    <circle cx="50" cy="50" r="6" fill="#A6D8D0" opacity="0.8"/>
    <circle cx="50" cy="-50" r="5" fill="#768B6C" opacity="0.9"/>
    <circle cx="-50" cy="50" r="5" fill="#768B6C" opacity="0.9"/>
  </g>

  <!-- Title and Subtitle -->
  <text x="400" y="425" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">Translational Cellular Therapeutics</text>
  <text x="400" y="465" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#A5ACB8" text-anchor="middle" letter-spacing="0.3">From Laboratory Discovery to Pediatric Care</text>
  
  <!-- Institutional watermark -->
  <text x="400" y="530" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="rgba(166, 216, 208, 0.6)" text-anchor="middle" letter-spacing="1">BANGLADESH SHISHU HOSPITAL &amp; INSTITUTE</text>
</svg>